<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MQTT Chat</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .message-container {
        padding: 10px;
        border-radius: 8px;
        margin: 5px 0;
        width: fit-content;
        max-width: 80%;
    }
    .sent {
        background-color: #DCF8C6;
        align-self: flex-end;
    }
    .received {
        background-color: #EFEFEF;
        align-self: flex-start;
    }
    .messages {
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-height: 300px;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        margin-bottom: 10px;
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
        background-color: #28a745;
        color: white;
        cursor: pointer;
        font-weight: bold;
        border: none;
    }
    button:hover {
        background-color: #218838;
    }
    .client-info {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<script>
    var mqttBroker = "localhost";
    var mqttPort = 1884;
    var mqttTopic = "hello/topic";
    var clientId = "Client_" + Math.floor(Math.random() * 1000);
    var client = new Paho.MQTT.Client(mqttBroker, mqttPort, clientId);
    
    client.onConnectionLost = function(responseObject) {
        if (responseObject.errorCode !== 0) {
            console.log("Connection lost: " + responseObject.errorMessage);
        }
    };
    
    client.onMessageArrived = function(message) {
        var msgArray = message.payloadString.split(":");
        var sender = msgArray[0].trim();
        var msgContent = msgArray[1].trim();
        if (sender !== clientId) {
            displayMessage(sender + ": " + msgContent, 'received');
        }
    };
    
    function connectClient() {
        var username = document.getElementById("usernameInput").value;
        var password = document.getElementById("passwordInput").value;
        client.connect({
            onSuccess: function() {
                client.subscribe(mqttTopic);
                displayClientInfo(clientId);
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("chatSection").style.display = "block";
            },
            userName: username,
            password: password
        });
    }
    
    function publishMessage() {
        var message = document.getElementById("messageInput").value;
        var msg = new Paho.MQTT.Message(clientId + ": " + message);
        msg.destinationName = mqttTopic;
        client.send(msg);
        displayMessage(clientId + ": " + message, 'sent');
        document.getElementById("messageInput").value = "";
    }
    
    function displayMessage(message, messageType) {
        var messageDiv = document.createElement("div");
        messageDiv.classList.add("message-container", messageType);
        messageDiv.textContent = message;
        document.getElementById("messages").appendChild(messageDiv);
        document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
    }
    
    function displayClientInfo(clientId) {
        document.getElementById("clientInfo").textContent = "Connected as: " + clientId;
    }
</script>
</head>
<body>
    <div class="container">
        <div id="loginSection">
            <input type="text" id="usernameInput" placeholder="Username">
            <input type="password" id="passwordInput" placeholder="Password">
            <button onclick="connectClient()">Connect</button>
        </div>
        
        <div id="chatSection" style="display: none;">
            <div id="clientInfo" class="client-info"></div>
            <div id="messages" class="messages"></div>
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button onclick="publishMessage()">Send</button>
        </div>
    </div>
</body>
</html>
